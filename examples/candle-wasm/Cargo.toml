[package]
name = "valendra-candle-wasm"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
candle-core = "=0.11.1"
candle-nn = "=0.11.1"
candle-transformers = "=0.11.1"
tokenizers = { version = "=0.22.2", default-features = false, features = ["unstable_wasm"] }
wasm-bindgen = "=0.2.130"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode_categories = "=0.1.1"

[profile.release]
opt-level = 3
lto = true
